server.port=8082
server.server-header=

# Allowed CORS origins — comma-separated list of frontend URLs permitted to call this API.
# In production replace with the real domain (e.g. https://app.example.com).
app.cors.allowed-origins=http://localhost:4200

# Using Supavisor pooler (session mode) instead of the direct connection:
# db.<ref>.supabase.co is IPv6-only unless the IPv4 add-on is enabled, which breaks
# JDBC connectivity on IPv4-only networks. The pooler is always IPv4.
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres.nyxclhzsaukcbebxrvmz}
spring.datasource.password=${DB_PASSWORD:skt8NBh049w19VaV}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Request body size limits
server.tomcat.max-http-form-post-size=2097152
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# JWT — PRODUCTION: set JWT_SECRET env var with a 256-bit random key:
#   openssl rand -base64 64
# The fallback below is for local development ONLY; never use it in production.
jwt.secret=${JWT_SECRET:czZ3OWEvQkUrSGJQZVNoVm1ZcTN0Nnc5eiRDJkYpSkBOY1JmVWpYbjJyNXU4eHgvQQ==}
jwt.expiration=86400000

# JWT Cookie security — set to true in production (requires HTTPS).
# HttpOnly cookie is not accessible via JavaScript, preventing XSS token theft.
# Secure=false is acceptable in local HTTP dev; MUST be true on any internet-facing server.
jwt.cookie.secure=false

# Rate limiting (requests per minute per IP)
app.rate-limit.max-requests=60
# Stricter limit for auth endpoints (brute-force protection)
app.rate-limit.auth-max-requests=10
# PRODUCTION behind a reverse proxy/load balancer only: set to true so the real client
# IP (X-Forwarded-For) is used instead of the proxy's socket address. Never enable this
# unless the proxy always overwrites the header — otherwise clients can spoof their IP
# and bypass rate limiting.
app.rate-limit.trust-proxy-headers=false
